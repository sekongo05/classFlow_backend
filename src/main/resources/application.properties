spring.application.name=classFlow
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

classflow.establishment-name=${CLASSFLOW_ESTABLISHMENT_NAME:ClassFlow Institut Supérieur}
classflow.jwt.secret=${CLASSFLOW_JWT_SECRET}
classflow.cors.allowed-origins=${CLASSFLOW_CORS_ALLOWED_ORIGINS:http://localhost:5173}
classflow.jwt.access-token-expiration-ms=${CLASSFLOW_JWT_ACCESS_EXPIRATION_MS:900000}
classflow.jwt.refresh-token-expiration-ms=${CLASSFLOW_JWT_REFRESH_EXPIRATION_MS:604800000}
classflow.attendance.late-tolerance-minutes=${CLASSFLOW_LATE_TOLERANCE_MINUTES:15}
classflow.attendance.max-late-minutes=${CLASSFLOW_MAX_LATE_MINUTES:60}
classflow.attendance.scheduler-interval-ms=${CLASSFLOW_SCHEDULER_INTERVAL_MS:60000}
