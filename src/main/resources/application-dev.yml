spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/classflow}
    username: ${SPRING_DATASOURCE_USERNAME:classflow}
    password: ${SPRING_DATASOURCE_PASSWORD:classflow}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
