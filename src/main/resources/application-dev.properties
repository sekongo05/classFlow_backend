spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/classflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:classflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:classflow}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
