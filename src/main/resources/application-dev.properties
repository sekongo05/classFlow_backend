spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:classflow_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
classflow.jwt.secret=${CLASSFLOW_JWT_SECRET:classflow-dev-secret-key-change-in-production-at-least-256-bits-long}
classflow.cors.allowed-origins=${CLASSFLOW_CORS_ALLOWED_ORIGINS:*}
